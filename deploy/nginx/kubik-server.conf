# Included by NPM's server_proxy.conf; do not expose any other backend paths.
location = /kubik/v1 {
    if ($host != agent.example.com) { return 404; }
    if ($scheme != https) { return 404; }
    limit_req zone=kubik_handshake burst=10 nodelay;
    limit_conn kubik_clients 8;
    limit_conn kubik_total 32;
    proxy_pass http://127.0.0.1:18790;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_buffer_size 4k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
    proxy_send_timeout 30s;
}

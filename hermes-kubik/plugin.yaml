name: kubik
label: Kubik
kind: platform
manifest_version: 2
version: 0.2.1
description: Native Kubik voice and text platform for Hermes Gateway; tested with Hermes 0.22.2.
author: Kubik
python_dependencies:
  - aiohttp==3.14.3
  - tornado>=6.5.9,<7
requires_env: []
optional_env:
  - name: KUBIK_PORT
    description: Profile-scoped TLS listener override; otherwise platforms.kubik.extra.port (18793).
    password: false

name: Acceptance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true
env:
  UV_CACHE_DIR: ${{ github.workspace }}/.ci-cache/uv
  PIP_CACHE_DIR: ${{ github.workspace }}/.ci-cache/pip
  npm_config_cache: ${{ github.workspace }}/.ci-cache/npm
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-ci
        id: prepare
        with:
          lane: lint
      - run: python3 tools/accept.py lint
      - name: Save lint dependency downloads
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            .ci-cache/uv
            .ci-cache/pip
            .ci-cache/npm/_cacache
          key: ${{ steps.prepare.outputs.download-key }}
  checks:
    name: ${{ matrix.os }} / ${{ matrix.stage }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
        stage: [agent, native, build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.stage == 'build' && 50 || 30 }}
    env:
      IDF_CCACHE_ENABLE: '1'
      CCACHE_DIR: ${{ github.workspace }}/.ci-cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 512M
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-ci
        id: prepare
        with:
          lane: ${{ matrix.stage }}
      - name: Run the complete stage
        shell: bash
        env:
          STAGE: ${{ matrix.stage }}
        run: |
          if [ "$STAGE" != agent ]; then
            source "$RUNNER_TEMP/esp-idf/export.sh"
          fi
          if [ "$STAGE" = native ] && [ "$RUNNER_OS" = Linux ]; then
            STAGE=native-portable
          fi
          python3 tools/accept.py "$STAGE"
      - name: Compiler cache statistics
        if: always() && matrix.stage == 'build'
        run: ccache --show-stats
      - name: Save verified compiler cache
        if: success() && matrix.stage == 'build' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache/save@v6.1.0
        with:
          path: .ci-cache/ccache
          key: ${{ steps.prepare.outputs.compiler-key }}
      - name: Save dependency downloads
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            .ci-cache/uv
            .ci-cache/pip
            .ci-cache/npm/_cacache
          key: ${{ steps.prepare.outputs.download-key }}
  acceptance:
    # Keep one required status and the exact-SHA publication gate.
    needs: [lint, checks]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every stage
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          test "$LINT_RESULT" = success
          test "$CHECKS_RESULT" = success

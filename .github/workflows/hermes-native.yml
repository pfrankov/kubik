name: Hermes native compatibility
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hermes-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  hermes:
    name: Hermes 0.22.2 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read immutable upstream contract
        id: pin
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          pin = json.loads(Path('tools/hermes_native/upstream.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print(f'python={pin["python"]}', file=out)
          PY
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.pin.outputs.python }}
      - name: Install the pinned environment manager and audio converter
        shell: bash
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r tools/ci-uv.requirements.txt
          if ! command -v ffmpeg >/dev/null; then
            if [ "${{ runner.os }}" = Linux ]; then
              sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg
            else
              brew install ffmpeg
            fi
          fi
      - name: Exercise actual Hermes Gateway and AIAgent with local HTTP fixtures
        shell: bash
        run: |
          python tools/test-hermes-native.py --prepare "$RUNNER_TEMP/hermes-native-source" > "$RUNNER_TEMP/hermes-native.log" 2>&1 || { tail -n 160 "$RUNNER_TEMP/hermes-native.log"; exit 1; }
          tail -n 20 "$RUNNER_TEMP/hermes-native.log"
